<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레쉽(ReEasy) - 레시피를 쉽게!</title>
    <style>
        :root {
            --primary: #2E7D32;
            --bg: #F4F6F8;
            --card: #FFFFFF;
            --text: #212121;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }
        
        .easy-mode-banner {
            background-color: #E8F5E9;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #C8E6C9;
        }
        .easy-mode-banner span { font-weight: bold; font-size: 15px; color: #1B5E20; }
        
        main { padding: 20px; flex: 1; }
        .card {
            background: #F9F9F9;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #1B5E20;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .price-compare {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #EEEEEE;
        }
        .badge-red { background: #FFEBEE; color: #C62828; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-green { background: #E8F5E9; color: #2E7D32; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        
        button.btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(46,125,50,0.2);
        }
        button.btn-primary:active { transform: scale(0.98); }
        
        .result-box {
            margin-top: 15px;
            background: #FFF8E1;
            border: 1px solid #FFE082;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            display: none;
        }
        footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #757575;
            background: #FAFAFA;
            border-top: 1px solid #EEEEEE;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>레쉽 (ReEasy)</h1>
        <p>공공데이터 기반 적정기술 맞춤 식단 솔루션</p>
    </header>

    <div class="easy-mode-banner">
        <span>👵 어르신·쉬운 글자 모드</span>
        <input type="checkbox" id="easyToggle" onchange="toggleEasyMode()" style="transform: scale(1.3);">
    </div>

    <main>
        <!-- 기능 1: 실시간 알뜰 대체 식재료 추천 -->
        <div class="card">
            <div class="card-title">💡 오늘 물가 기준 대체 식재료 추천</div>
            <div class="price-compare">
                <div>
                    <span class="badge-red">가격 상승</span><br>
                    <strong style="font-size:15px;">시금치</strong>
                    <div style="font-size:12px; color:#757575;">4,500원 / 300g</div>
                </div>
                <div style="font-size:20px; color:#9E9E9E;">➔</div>
                <div>
                    <span class="badge-green">가성비 추천</span><br>
                    <strong style="font-size:15px; color:#2E7D32;">부추 (동일 영양)</strong>
                    <div style="font-size:12px; color:#2E7D32;">1,800원 / 300g</div>
                </div>
            </div>
        </div>

        <!-- 기능 2: 예산 맞춤 1인분 레시피 생성 -->
        <div class="card">
            <div class="card-title">🍲 1인분 알뜰 영양 식단 맞추기</div>
            <p style="font-size:13px; color:#616161; margin-top:0;">소유 예산과 기저질환을 선택하면 최적 레시피를 계산합니다.</p>
            
            <label style="font-size:13px; font-weight:bold;">한 끼 예산 설정:</label>
            <select id="budgetSelect" style="width:100%; padding:10px; margin:5px 0 15px 0; border-radius:6px; border:1px solid #CCC;">
                <option value="3000">3,000원 이하 (초알뜰)</option>
                <option value="5000" selected>5,000원 이하 (권장)</option>
                <option value="7000">7,000원 이하</option>
            </select>

            <button class="btn-primary" onclick="generateMeal()">오늘의 쉬운 레시피 보기</button>

            <div id="resultBox" class="result-box">
                <strong id="resultTitle" style="color:#B71C1C; font-size:16px;"></strong>
                <p id="resultDesc" style="margin:8px 0 0 0; line-height:1.5;"></p>
            </div>
        </div>
    </main>

    <footer>
        <p><strong>[레쉽 - 적정기술 프로젝트]</strong></p>
        <p>데이터 출처: 농림축산식품부, 가락시장, 식약처 공공 API</p>
    </footer>
</div>

<script>
    function toggleEasyMode() {
        const isChecked = document.getElementById('easyToggle').checked;
        if(isChecked) {
            document.body.style.fontSize = "18px";
            document.querySelectorAll('.card-title').forEach(el => el.style.fontSize = "20px");
            document.querySelector('.btn-primary').style.padding = "22px";
            document.querySelector('.btn-primary').style.fontSize = "22px";
        } else {
            document.body.style.fontSize = "14px";
            document.querySelectorAll('.card-title').forEach(el => el.style.fontSize = "16px");
            document.querySelector('.btn-primary').style.padding = "16px";
            document.querySelector('.btn-primary').style.fontSize = "18px";
        }
    }

    function generateMeal() {
        const budget = document.getElementById('budgetSelect').value;
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');

        resultBox.style.display = "block";

        if(budget === "3000") {
            resultTitle.innerText = "✅ [3,000원 이하] 계란 부추 덮밥 & 콩나물국";
            resultDesc.innerText = "비타민과 단백질을 동시에 챙길 수 있는 초저가 영양 식단입니다. (예상 재료비: 2,400원)";
        } else if(budget === "5000") {
            resultTitle.innerText = "✅ [5,000원 이하] 두부 제육 볶음 & 제철 채소쌈";
            resultDesc.innerText = "공공데이터 추천 제철 채소를 활용하여 나트륨을 줄이고 단백질을 높인 맞춤 식단입니다. (예상 재료비: 4,200원)";
        } else {
            resultTitle.innerText = "✅ [7,000원 이하] 고등어 구이 & 버섯 된장찌개";
            resultDesc.innerText = "오메가-3와 식이섬유가 풍부한 건강 강화 식단입니다. (예상 재료비: 6,100원)";
        }
    }
</script>

</body>
</html>
